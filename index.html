<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京旅遊規劃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .home-view {
    height: 100%;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .hero-card {
    width: 100%;
    max-width: 460px;
    padding: 36px 32px;
    text-align: center;
  }

  .hero-card .eyebrow {
    display: inline-block;
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    font-weight: 700;
    background: var(--dozo-yellow);
    border: 1.6px solid var(--dozo-ink);
    border-radius: 999px;
    padding: 2px 10px;
    margin: 0 0 14px;
  }

  .hero-card h1 {
    font-family: 'GenJyuuGothic', 'Noto Serif TC', serif;
    font-size: 2.4rem;
    margin: 0 0 8px;
    color: var(--dozo-ink);
  }

  .hero-card .dates {
    display: inline-block;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--chip-bg);
    border: 1.4px solid var(--border);
    border-radius: 999px;
    padding: 4px 16px;
    margin: 0 0 32px;
  }

  .progress-widget {
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-widget:hover .progress-track { box-shadow: 0 0 0 3px var(--chip-bg); }

  .progress-track {
    height: 14px;
    border-radius: 999px;
    background: var(--chip-bg);
    border: 1.6px solid var(--dozo-ink);
    overflow: hidden;
    transition: box-shadow 0.15s ease;
  }
  .progress-fill {
    height: 100%;
    background: var(--dozo-green);
    width: 0%;
    transition: width 0.3s ease, background-color 0.3s ease;
  }
  .progress-fill.complete { background: var(--dozo-yellow); }

  .progress-label {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--dozo-ink);
  }
  .progress-label.complete {
    font-size: 1.15rem;
    color: var(--dozo-red);
  }

  .progress-hint {
    margin: 4px 0 0;
    font-size: 0.68rem;
    color: var(--ink-soft);
  }

  .todo-panel {
    margin-top: 18px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.22s ease, opacity 0.22s ease;
    text-align: left;
  }
  .todo-panel.open {
    opacity: 1;
  }
  .todo-panel .panel-note {
    margin: 0 0 10px;
    font-size: 0.68rem;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .todo-list {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 4px;
    border-radius: 8px;
  }
  .todo-item:hover { background: var(--chip-bg); }
  .todo-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--dozo-green);
    flex: none;
  }
  .todo-item span {
    flex: 1;
    font-size: 0.86rem;
    color: var(--dozo-ink);
  }
  .todo-item.done span {
    color: var(--chip-inactive);
    text-decoration: line-through;
  }
  .todo-item .todo-remove {
    flex: none;
    border: none;
    background: none;
    color: var(--chip-inactive);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .todo-item .todo-remove:hover { background: var(--dozo-red); color: #fff; }
  .todo-add {
    display: flex;
    gap: 6px;
  }
  .todo-add input {
    flex: 1;
    border: 1.6px solid var(--dozo-ink);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 0.82rem;
  }
  .todo-add button {
    border: 1.6px solid var(--dozo-ink);
    border-radius: 8px;
    background: var(--dozo-ink);
    color: #fff;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 6px 12px;
    cursor: pointer;
  }
  .todo-add button:hover { background: var(--dozo-green); color: #0d1b14; }
</style>
</head>
<body>

<div class="mobile-bar">
  <button type="button" id="sidebarToggle">☰ 選單</button>
  <strong>首頁總覽</strong>
  <span></span>
</div>

<div class="app-shell">

<aside class="sidebar ui-card" id="sidebar">
  <div class="brand">
    <span class="eyebrow">TOKYO TRIP PLANNING</span>
    <h1><span class="accent">東京</span>旅遊規劃</h1>
  </div>
  <nav>
    <a href="index.html" class="active">首頁總覽</a>
    <a href="airport.html">機場交通</a>
    <a href="spots.html">熱門景點導覽</a>
    <a href="collect.html">通通丟進來</a>
    <a href="itinerary.html">行程安排</a>
    <a href="budget.html">記帳分帳</a>
  </nav>
</aside>

<div class="scrim" id="scrim"></div>

<main class="main-view">
  <div class="home-view">
    <div class="hero-card ui-card">
      <span class="eyebrow">TOKYO TRIP PLANNING</span>
      <h1>東京旅遊🇯🇵</h1>
      <span class="dates">12/23 ～ 12/27</span>

      <button type="button" class="progress-widget" id="progressWidget" aria-expanded="false" aria-controls="todoPanel">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-label" id="progressLabel">0 / 0 已完成</p>
      </button>
      <p class="progress-hint">點擊進度條查看待辦清單</p>

      <div class="todo-panel" id="todoPanel">
        <p class="panel-note">目前僅存在這台裝置的瀏覽器中,尚未與旅伴同步——「通通丟進來」「行程安排」上線後會改成共用資料。</p>
        <ul class="todo-list" id="todoList"></ul>
        <div class="todo-add">
          <input type="text" id="todoInput" placeholder="新增待辦事項...">
          <button type="button" id="todoAddBtn">新增</button>
        </div>
      </div>
    </div>
  </div>
</main>

</div>

<script src="sidebar.js"></script>
<script>
  const TODO_KEY = 'tokyoTripTodos';
  const DEFAULT_TODOS = [
    { text: '訂機票', done: false },
    { text: '訂住宿', done: false },
    { text: '確認護照效期', done: false },
    { text: '換日幣／準備付款方式', done: false },
    { text: '買網卡或開通漫遊', done: false },
    { text: '確認想去的景點清單', done: false }
  ];
  function loadTodos() {
    try {
      const raw = localStorage.getItem(TODO_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return DEFAULT_TODOS.slice();
  }
  function saveTodos(todos) {
    try { localStorage.setItem(TODO_KEY, JSON.stringify(todos)); } catch (e) {}
  }
  let todos = loadTodos();

  function renderTodos() {
    const list = document.getElementById('todoList');
    list.innerHTML = todos.map((t, i) => `
      <li class="todo-item ${t.done ? 'done' : ''}">
        <input type="checkbox" data-idx="${i}" ${t.done ? 'checked' : ''}>
        <span>${t.text}</span>
        <button type="button" class="todo-remove" data-idx="${i}" aria-label="刪除">×</button>
      </li>
    `).join('');

    const doneCount = todos.filter(t => t.done).length;
    const total = todos.length;
    const complete = total > 0 && doneCount === total;

    const fill = document.getElementById('progressFill');
    const label = document.getElementById('progressLabel');
    fill.style.width = total ? `${(doneCount / total) * 100}%` : '0%';
    fill.classList.toggle('complete', complete);
    label.classList.toggle('complete', complete);
    label.textContent = complete ? '出發～🥳' : `${doneCount} / ${total} 已完成`;

    list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        todos[Number(cb.dataset.idx)].done = cb.checked;
        saveTodos(todos);
        renderTodos();
      });
    });
    list.querySelectorAll('.todo-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        todos.splice(Number(btn.dataset.idx), 1);
        saveTodos(todos);
        renderTodos();
      });
    });

    if (todoPanel.classList.contains('open')) syncTodoPanelHeight();
  }

  function syncTodoPanelHeight() {
    todoPanel.style.maxHeight = todoPanel.classList.contains('open')
      ? todoPanel.scrollHeight + 'px'
      : '0px';
  }

  function addTodo() {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    saveTodos(todos);
    input.value = '';
    renderTodos();
  }
  document.getElementById('todoAddBtn').addEventListener('click', (e) => { e.stopPropagation(); addTodo(); });
  document.getElementById('todoInput').addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('todoInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  const progressWidget = document.getElementById('progressWidget');
  const todoPanel = document.getElementById('todoPanel');
  progressWidget.addEventListener('click', () => {
    const open = todoPanel.classList.toggle('open');
    progressWidget.setAttribute('aria-expanded', String(open));
    syncTodoPanelHeight();
  });

  renderTodos();
</script>
</body>
</html>
